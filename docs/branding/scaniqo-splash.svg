<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432" role="img" aria-labelledby="title description">
  <title id="title">Scaniqo splash animation</title>
  <desc id="description">A coherent capture frame explores the document along an irregular curved path, settles into place, then the right eye winks. One 3000 ms animation, ending at the original logo.</desc>
  <!-- Same cubic path, pacing curve, scale keyframes and opacity timing as the native AVD. -->
  <!-- The frame searches above the document, then returns behind it after alignment at 2460 ms. -->
  <rect width="108" height="108" fill="#06364A" />
  <g id="scaniqo_scanner">
    <path id="scaniqo_scanner_rest_top_left" d="M31,40V36Q31,31 36,31H40" fill="none" stroke="#71E2C3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.02;0.025;0.82;0.825;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="1;1;0;0;1;1" />
    </path>
    <path id="scaniqo_scanner_rest_bottom_right" d="M77,68V72Q77,77 72,77H68" fill="none" stroke="#71E2C3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.02;0.025;0.82;0.825;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="1;1;0;0;1;1" />
    </path>
  </g>
  <g id="scaniqo_document_translation">
    <animateTransform attributeName="transform" type="translate" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.12;0.28;0.43;0.56;0.65;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="0 0;-3 1;3 -1.5;-2 1;0.6 -0.3;0 0;0 0" />
    <g id="scaniqo_document" transform="rotate(-8 54 54)">
      <animateTransform attributeName="transform" type="rotate" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.12;0.28;0.43;0.56;0.65;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="-8 54 54;-14 54 54;2 54 54;-12 54 54;-6 54 54;-8 54 54;-8 54 54" />
      <path d="M42,30H59L73,44V68Q73,76 65,76H42Q34,76 34,68V38Q34,30 42,30Z" fill="#FFF9EC" />
      <path d="M59,30L73,44H65Q59,44 59,38Z" fill="#FF866F" />
      <path d="M43,41H50" fill="none" stroke="#7DABA8" stroke-width="2.8" stroke-linecap="round" />
      <path d="M44.5,49.5V53" fill="none" stroke="#06364A" stroke-width="3.6" stroke-linecap="round" />
      <path id="scaniqo_right_eye_open" d="M60,49.5V53" fill="none" stroke="#06364A" stroke-width="3.4" stroke-linecap="round">
        <animate attributeName="stroke-opacity" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.86;0.94;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="1;1;0;0" />
      </path>
      <path id="scaniqo_right_eye_wink" d="M57,52Q60,48.5 63,52" fill="none" stroke="#06364A" stroke-opacity="0" stroke-width="3.4" stroke-linecap="round">
        <animate attributeName="stroke-opacity" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.86;0.94;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="0;0;1;1" />
      </path>
      <path d="M45.5,61Q53.5,68.5 62,60" fill="none" stroke="#06364A" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
  <g id="scaniqo_scanner_search">
    <animateMotion dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline"
      keyTimes="0;0.02;0.18;0.31;0.47;0.64;0.82;1"
      keyPoints="0;0;0.14;0.36;0.57;0.8;1;1"
      keySplines="0 0 1 1;0.333331 0 0.666669 0.56055;0.333331 0.227218 0.666669 0.7088;0.333331 0.375467 0.666669 0.66161;0.333335 0.328274 0.666665 0.699383;0.333333 0.36605 0.666667 1;0 0 1 1"
      path="M0,0 C-1.733333,-1.083333 -7.466667,-6.066667 -8,-5 C-8.533333,-3.933333 -6.133333,6.933333 -4,8 C-1.866667,9.066667 6.933333,5.266667 8,3 C9.066667,0.733333 5.866667,-8.333333 4,-9 C2.133333,-9.666667 -5.2,-3.866667 -6,-2 C-6.8,-0.133333 -2.8,4.733333 -2,5 C-1.2,5.266667 -0.433333,1.083333 0,0" />
    <g transform="translate(54 54)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.02;0.12;0.64;0.74;0.82;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="1 1;1 1;0.7 0.7;0.7 0.7;0.82 0.82;1 1;1 1" />
        <g transform="translate(-54 -54)">
          <path id="scaniqo_scanner_search_stroke" d="M31,40V36Q31,31 36,31H40M77,68V72Q77,77 72,77H68" fill="none" stroke="#71E2C3" stroke-opacity="0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="stroke-opacity" dur="3000ms" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;0.02;0.825;0.855;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" values="0;1;1;0;0" />
          </path>
        </g>
      </g>
    </g>
  </g>
</svg>
